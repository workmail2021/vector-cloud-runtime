services:
  - type: web
    name: vector-ai-assistant
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 vector_cloud_entrypoint.py"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
